</head>

<body class="home">

    </div>

    <!-- BRANDING -->
    <div>
        <h1 class="xdx">
            <b class="x">X</b><b class="d">D</b><b class="x">X</b><b class="x">CODE</b>
        </h1>

        <h1 class="sub-heading">
            // <span id="typing-text"></span>
        </h1>
    </div>

    <!-- HERO SECTION -->
    <div class="ab">
        <div class="title">
            <p>
                <b class="building">Building</b><br>
                <b>Digital</b><br>

    <!-- MAIN BUTTONS -->
    <a href="Portfolio Projects.html">

    <!-- SCROLL TO TOP BUTTON -->
    <button id="topButton" type="button" aria-label="Scroll to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- THEME TOGGLE BUTTON -->
    <button id="themeToggle" type="button" aria-label="Toggle theme">
        <i class="fas fa-sun"></i>
    </button>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script>

        /* =====================================
           TYPING ANIMATION
        ====================================== */

        const phrases = [
            "ASPIRING SOFTWARE ENGINEER",
            "PYTHON DEVELOPER",
            "WEB DEVELOPER",
            "CREATIVE BUILDER"
        ];

        const typingText = document.getElementById("typing-text");

        let phraseIndex = 0;
        let letterIndex = 0;
        let deleting = false;

        function typeEffect() {

            let currentPhrase = phrases[phraseIndex];

            if (deleting) {
                letterIndex--;
            } else {
                letterIndex++;
            }

            typingText.textContent =
                currentPhrase.substring(0, letterIndex);

            if (!deleting && letterIndex === currentPhrase.length) {

                deleting = true;

                setTimeout(typeEffect, 1200);
                return;
            }

            if (deleting && letterIndex === 0) {

                deleting = false;

                phraseIndex =
                    (phraseIndex + 1) % phrases.length;
            }

            setTimeout(typeEffect, deleting ? 50 : 100);
        }

        typeEffect();


        /* =====================================
           SCROLL TO TOP
        ====================================== */

        const topButton =
            document.getElementById("topButton");

        window.addEventListener("scroll", function() {

            if (window.scrollY > 200) {
                topButton.style.display = "flex";
            } else {
                topButton.style.display = "none";
            }

        });

        topButton.addEventListener("click", function() {

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        });


        /* =====================================
           LIGHT AND DARK THEME
        ====================================== */

        const themeToggle =
            document.getElementById("themeToggle");

        function toggleTheme() {

            document.body.classList.toggle("light-theme");

            if (document.body.classList.contains("light-theme")) {

                themeToggle.innerHTML =
                    '<i class="fas fa-moon"></i>';

            } else {

                themeToggle.innerHTML =
                    '<i class="fas fa-sun"></i>';

            }

        }

        themeToggle.addEventListener("click", toggleTheme);


        /* =====================================
           DRAGGABLE THEME BUTTON
        ====================================== */

        let isDragging = false;

        let offsetX = 0;
        let offsetY = 0;

        let startX = 0;
        let startY = 0;

        let hasMoved = false;

        themeToggle.addEventListener("pointerdown", function(event) {

            isDragging = true;
            hasMoved = false;

            const rect = themeToggle.getBoundingClientRect();

            offsetX = event.clientX - rect.left;
            offsetY = event.clientY - rect.top;

            startX = event.clientX;
            startY = event.clientY;

            themeToggle.setPointerCapture(event.pointerId);

        });


        themeToggle.addEventListener("pointermove", function(event) {

            if (!isDragging) return;

            const distanceX = event.clientX - startX;
            const distanceY = event.clientY - startY;

            if (Math.abs(distanceX) > 3 ||
                Math.abs(distanceY) > 3) {

                hasMoved = true;

            }

            if (!hasMoved) return;

            const buttonWidth = themeToggle.offsetWidth;
            const buttonHeight = themeToggle.offsetHeight;

            let newLeft = event.clientX - offsetX;
            let newTop = event.clientY - offsetY;

            // Keep the button inside the screen

            newLeft = Math.max(
                0,
                Math.min(newLeft, window.innerWidth - buttonWidth)
            );

            newTop = Math.max(
                0,
                Math.min(newTop, window.innerHeight - buttonHeight)
            );

            themeToggle.style.left = newLeft + "px";
            themeToggle.style.top = newTop + "px";

            themeToggle.style.right = "auto";
            themeToggle.style.bottom = "auto";

        });


        themeToggle.addEventListener("pointerup", function(event) {

            isDragging = false;

            if (themeToggle.hasPointerCapture(event.pointerId)) {
                themeToggle.releasePointerCapture(event.pointerId);
            }

        });


        themeToggle.addEventListener("pointercancel", function() {

            isDragging = false;

        });


        // Prevent accidental text selection while dragging

        themeToggle.addEventListener("dragstart", function(event) {
            event.preventDefault();
        });

    </script>

</body>
</html>
